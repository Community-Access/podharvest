[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podharvest"
dynamic = ["version"]
description = "Archive any RSS/Atom/podcast feed as Markdown, HTML, text and JSON, download every enclosure, and transcribe the audio on your own machine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["rss", "atom", "podcast", "archive", "transcription", "whisper", "accessibility", "offline"]
authors = [{ name = "podharvest contributors" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: GTK",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]

# The core pipeline - feed parsing, conversion, rendering, downloading - runs
# on the standard library alone. Everything heavier is an extra, and is also
# installed on demand into the portable app space at first use.
dependencies = []

[project.optional-dependencies]
gui = ["wxPython>=4.2"]
asr = [
    "huggingface_hub>=0.24",
    "faster-whisper>=1.0",
]
vosk = ["vosk>=0.3.45"]
moonshine = ["useful-moonshine-onnx>=0.2", "onnxruntime>=1.17", "numpy>=1.24"]
onnx = ["sherpa-onnx>=1.10"]
enrich = ["llama-cpp-python>=0.2.90"]
diarize = ["pyannote.audio>=3.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/community-access/podharvest"
Repository = "https://github.com/community-access/podharvest"
Issues = "https://github.com/community-access/podharvest/issues"
Changelog = "https://github.com/community-access/podharvest/blob/main/CHANGELOG.md"
Accessibility = "https://github.com/community-access/podharvest/blob/main/docs/ACCESSIBILITY.md"

[project.scripts]
podharvest = "podharvest.cli:main"

[project.gui-scripts]
# Same entry point, but without a console window on Windows.
podharvest-gui = "podharvest.cli:main_gui"

[tool.setuptools]
packages = ["podharvest"]

[tool.setuptools.dynamic]
version = { attr = "podharvest.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:podharvest.*",
]

[tool.coverage.run]
source = ["podharvest"]
omit = ["podharvest/gui.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "B008",    # function calls in argument defaults are fine for argparse types
    "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
